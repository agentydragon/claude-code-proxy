<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Request-Response Flows</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    .flow-row { cursor: pointer; }
    .flow-dot { stroke: #000; }
    .highlight { stroke-width: 3px; }
  </style>
</head>
<body>
  <h1>Flows for session {{ session }}</h1>
  <svg width="960" height="600"></svg>
  <div id="details" style="white-space: pre; margin-top: 1em;"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const session = params.get('session') || '{{ session }}';
    fetch(`/flows/data?session=${session}`)
      .then(res => res.json())
      .then(data => render(data.flows));

    function render(flows) {
      flows.forEach(f => {
        if (!f.anthropic_request || !f.anthropic_request.timestamp) console.warn(`Missing anthropic_request timestamp for flow ${f.request_id}`);
        if (!f.openai_request || !f.openai_request.timestamp) console.warn(`Missing openai_request timestamp for flow ${f.request_id}`);
        if (!f.openai_response || !f.openai_response.timestamp) console.warn(`Missing openai_response timestamp for flow ${f.request_id}`);
        if (!f.anthropic_response || !f.anthropic_response.timestamp) console.warn(`Missing anthropic_response timestamp for flow ${f.request_id}`);
      });
      const svg = d3.select('svg');
      const width = +svg.attr('width');
      const rowHeight = 30;
      const times = flows.flatMap(f => {
        const ts = [];
        if (f.anthropic_request && f.anthropic_request.timestamp) ts.push(f.anthropic_request.timestamp);
        if (f.openai_request && f.openai_request.timestamp) ts.push(f.openai_request.timestamp);
        if (f.openai_response && f.openai_response.timestamp) ts.push(f.openai_response.timestamp);
        if (f.anthropic_response && f.anthropic_response.timestamp) ts.push(f.anthropic_response.timestamp);
        return ts;
      });
      const x = d3.scaleLinear()
        .domain(d3.extent(times))
        .range([100, width - 50]);

      flows.forEach((f, i) => {
        const y = i * rowHeight + 50;
        const stageSpacing = 20;
        const color = d3.schemeCategory10[i % 10];
        const seq = [];
        if (f.anthropic_request && f.anthropic_request.timestamp) seq.push(['anthropic_request', f.anthropic_request.timestamp]);
        if (f.openai_request && f.openai_request.timestamp) seq.push(['openai_request', f.openai_request.timestamp]);
        if (f.openai_response && f.openai_response.timestamp) seq.push(['openai_response', f.openai_response.timestamp]);
        if (f.anthropic_response && f.anthropic_response.timestamp) seq.push(['anthropic_response', f.anthropic_response.timestamp]);
        svg.append('path')
          .attr('d', d3.line()(seq.map(([k,t], idx) => [x(t), y + idx * stageSpacing])))
          .attr('stroke', color)
          .attr('fill', 'none')
          .attr('class', 'flow-row')
          .on('mouseover', function() { d3.select(this).classed('highlight', true); })
          .on('mouseout', function() { d3.select(this).classed('highlight', false); });
        seq.forEach(([k, t], idx) => {
          svg.append('circle')
            .attr('cx', x(t))
            .attr('cy', y + idx * stageSpacing)
            .attr('r', 5)
            .attr('fill', color)
            .attr('class', 'flow-dot')
            .on('mouseover', function() { d3.select(this).classed('highlight', true); })
            .on('mouseout', function() { d3.select(this).classed('highlight', false); })
            .on('click', function() {
              const info = { request_id: f.request_id, key: k, data: f[k] };
              const d = document.getElementById('details');
              const text = JSON.stringify(info, null, 2);
              d.textContent = d.textContent === text ? '' : text;
            });
        });
      });
    }
  </script>
</body>
</html>
